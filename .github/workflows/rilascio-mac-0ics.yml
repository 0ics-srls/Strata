name: Rilascio Mac 0ics

# The Metal engine the Mac Studio installs (ubuntu-ai, stack `mac`): the build of metal-build.yml at the tag, with the
# pins read from setup.py and metal/setup_mac.py (the sources the Mac's own build uses), a reproducible BUILD.json
# (version, commit, ggml, metal-cpp), packaged with the branch's own tools: the engine package (package_engine.py: the
# binary with the Metal sources and data it reads at start beside it, every file hashed in engine-component.json) and the
# Terminal archive (package_terminal.py: the Python server with CPython 3.12.15 and the hashed lock); SHA256SUMS of all.

on:
  push:
    tags: ["v*-mac-0ics.*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # the macOS 26 SDK, as metal-build.yml: metal/src/mtl_rt.mm names MTLGPUFamilyMetal4 behind @available
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # the history: BUILD.json names the commit of the engine's sources, not the tag's

      - name: The tag is on mac-studio-0ics
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/mac-studio-0ics

      - name: Tools
        run: brew install ninja

      # the build is ci/costruisci-mac.sh, the same script ubuntu-ai's esegui runs on the Mac Studio
      - name: Build, package, SHA256SUMS (ci/costruisci-mac.sh)
        run: |
          # the commit of the engine's sources: the last commit that changes anything outside .github/ (the tag can sit
          # on a commit that only adds a workflow); the tag's own commit is tag_commit
          STRATA_SOURCE_COMMIT=$(git log -1 --format=%H -- . ':(exclude).github') STRATA_TAG_COMMIT="$GITHUB_SHA" \
            bash ci/costruisci-mac.sh "$RUNNER_TEMP/uscita" "$RUNNER_TEMP/cache"
          cp -R "$RUNNER_TEMP/uscita/dist" dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rilascio
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rilascio
          path: dist

      - name: Create the release of the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "Strata Metal for the Mac Studio (mac-studio-0ics): engine package (engine-component.json, every file hashed) + Terminal archive (CPython 3.12.15, hashed lock), SHA256SUMS of all files."
