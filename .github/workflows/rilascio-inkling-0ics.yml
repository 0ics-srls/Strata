# 0ics: the release image of strata-inkling (Inkling 2 Mini) for the V100 + RTX 4090 box (branch inkling-v100-4090), only
# from a tag `v<version>-inkling-0ics.N` on that branch. Dockerfile.ubuntu-ai compiles strata-inkling (CUDA 12.8, sm_70 +
# sm_89; nvcc needs no GPU), runs the engine's no-GPU tests and the server's Inkling tests (stage `prove`: one failure = no
# image) and keeps only /opt/strata on the CUDA runtime image. Published as ghcr.io/0ics-srls/strata-inkling-0ics:<tag>;
# ubuntu-ai only pulls it.
name: rilascio-inkling-0ics

on:
  push:
    tags: ["v*-inkling-0ics.*"]

permissions:
  contents: read

concurrency:
  group: rilascio-inkling-0ics-${{ github.ref }}
  cancel-in-progress: false

env:
  IMMAGINE: ghcr.io/0ics-srls/strata-inkling-0ics

jobs:
  immagine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # one branch for this engine on this hardware: a new upstream base is merged into inkling-v100-4090
      - name: Il tag sta su inkling-v100-4090
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/inkling-v100-4090
      # the devel image, the build tree and the venv do not fit in the ~14 GB the runner leaves free
      - name: Spazio sul disco
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Costruisci, prova e pubblica
        run: |
          docker build --progress=plain -f Dockerfile.ubuntu-ai \
            --build-arg "STRATA_COMMIT=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/0ics-srls/Strata" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMMAGINE:$GITHUB_REF_NAME" .
          docker run --rm --entrypoint cat "$IMMAGINE:$GITHUB_REF_NAME" /opt/strata/PROVE.txt /opt/strata/BUILD.json
          docker push -q "$IMMAGINE:$GITHUB_REF_NAME"
